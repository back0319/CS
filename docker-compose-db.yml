
name: didim-code-legacy-database

# 연구용 로컬 DB입니다. 실행하려면 --profile legacy-research를 명시하세요.
services:
  my-app-db:
    profiles: ["legacy-research"]
    container_name: "my-app-db"
    image: postgres
    ports:
      - "5432:5432"
    expose:
      - "5432"
    volumes:
      - "pgdata_volume:/var/lib/postgresql/data"
    environment:
      - "POSTGRES_DB=my-app-db"
      - "POSTGRES_USER=postgres"
      - "POSTGRES_PASSWORD=${LEGACY_POSTGRES_PASSWORD:?set LEGACY_POSTGRES_PASSWORD}"
    networks:
      - app-network
    
  pgadmin:
    profiles: ["legacy-research"]
    container_name: "pgadmin"
    image: dpage/pgadmin4
    ports:
      - "5050:80"
    environment:
      - "PGADMIN_DEFAULT_EMAIL=${LEGACY_PGADMIN_EMAIL:?set LEGACY_PGADMIN_EMAIL}"
      - "PGADMIN_DEFAULT_PASSWORD=${LEGACY_PGADMIN_PASSWORD:?set LEGACY_PGADMIN_PASSWORD}"
    networks:
      - app-network
    depends_on:
      - my-app-db

volumes:
  pgdata_volume:

networks:
  app-network:
    driver: bridge
